# Per-device profiles keyed by SHA256(serial)[:8].
# Each profile is the source of truth for what gets installed on that device.
# No profile = nothing installed.
#
# To find your profile ID:
#   system_profiler SPHardwareDataType | awk '/Serial/{print $NF}' | shasum -a 256 | cut -c1-8
